name: Clinical contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: clinical-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install locked runtime and verify synthetic workflows
        env:
          PYTHONNOUSERSITE: '1'
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/nexo-pycache
        run: python3 laboratorios-descargas/scripts/setup_runtime.py --venv "$RUNNER_TEMP/nexo-runtime"
