<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexo · Panel clínico</title><link rel="stylesheet" href="panel.css"><script src="../request/clinical_catalog.js" defer></script><script src="../request/drive_status.js" defer></script><script src="library_core.js" defer></script><script src="library_drive.js" defer></script><script src="connectivity.js" defer></script><script src="panel.js" defer></script></head>
<body><header><div class="brand"><img src="../icons/nexo-32.png" width="28" height="28" alt=""><strong>Nexo</strong></div><div class="header-actions"><details id="connection-details"><summary aria-label="Estado de conexión"><span id="worker-status" class="status" role="status">Mini · sin comprobar</span></summary><div id="connection-info"><strong>Conexión</strong><p><span id="mini-connection"></span><small id="mini-checked"></small></p><p>Drive · <span id="drive-connection"></span><small id="drive-checked"></small></p><small>Sincronización remota sin comprobar</small><button id="connection-reconnect" class="link" hidden>Reconectar Drive</button><button id="copy-diagnostic" class="link">Copiar diagnóstico</button><span id="diagnostic-status" class="status" role="status"></span><textarea id="diagnostic-text" readonly hidden aria-label="Diagnóstico de conexión"></textarea></div></details><button id="open-full" class="icon" aria-label="Abrir Nexo en una pestaña" title="Abrir en pestaña">↗</button></div></header>
<nav role="tablist" aria-label="Espacios de Nexo"><button id="tab-request" role="tab" aria-selected="true" aria-controls="view-request">Solicitar</button><button id="tab-library" role="tab" aria-selected="false" aria-controls="view-library" tabindex="-1">Resúmenes</button></nav>
<main><section id="view-request" role="tabpanel" aria-labelledby="tab-request"><iframe id="request-frame" title="Nueva solicitud clínica" src="../request/index.html?embedded=1" allow="clipboard-write"></iframe></section>
<section id="view-library" role="tabpanel" aria-labelledby="tab-library" hidden>
<div id="library-list-view"><button id="use-current-patient" class="link" hidden>Usar ficha abierta</button><div class="search-row"><label class="sr-only" for="patient-search">Buscar paciente por nombre o RUT</label><input id="patient-search" type="search" placeholder="Nombre o RUT" autocomplete="off"><button id="refresh-library" class="icon" aria-label="Actualizar resúmenes" title="Actualizar">↻</button></div><p id="library-origin" class="status"></p><p id="library-status" class="status" role="status"></p><button id="retry-library" class="link" hidden>Reintentar conexión</button><ul id="patient-list" aria-label="Pacientes"></ul><button id="connect-drive" class="link">Conectar carpeta de Drive</button></div>
<article id="summary-view" hidden><div class="patient-heading"><div><h1 id="patient-name"></h1><p id="patient-rut"></p></div><button id="change-patient" class="link">Cambiar</button></div><button id="open-patient-folder" class="link" hidden>Abrir expediente</button><label id="version-control" hidden><span class="sr-only">Versión del resumen</span><select id="summary-version" aria-label="Versión del resumen"></select></label><p id="summary-date" class="status"></p><p id="summary-status" class="status" role="status"></p><div id="summary-notice" class="summary-notice" hidden><span id="summary-notice-text" role="status"></span><button id="apply-update" class="link" hidden>Actualizar resumen</button><button id="summary-reconnect" class="link" hidden>Reconectar Drive</button></div><label class="sr-only" for="summary-text">Resumen del paciente seleccionado</label><textarea id="summary-text" readonly spellcheck="false" placeholder="Elige un resumen"></textarea><div class="copy-row"><button id="copy-summary" class="primary" disabled>Copiar resumen</button><span id="copy-status" class="status" role="status"></span></div></article>
<section id="drive-setup" hidden><div class="patient-heading"><h1>Resúmenes de Drive</h1><button id="cancel-drive" class="link">Volver</button></div><p>Conecta «Archivos Mac mini → Pacientes» de Google Drive para escritorio. Los textos se leen desde su copia sincronizada.</p><button id="reconnect-drive" class="primary" hidden>Reconectar carpeta</button><button id="choose-drive" class="link">Seleccionar carpeta</button><button id="forget-drive" class="link">Desconectar carpeta</button><p id="setup-status" class="status" role="status"></p></section>
</section></main></body></html>
